apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus-ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: PostgreSQL-DWH
    uid: PostgreSQL-DWH
    type: postgres
    access: proxy
    url: postgres:5432
    user: pharma_admin
    secureJsonData:
      password: pharma_secret_pw
    jsonData:
      database: dwh
      sslmode: disable
      postgresVersion: 1600
    editable: true
