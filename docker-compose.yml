services:
  postgres:
    image: postgres:16.4-alpine
    container_name: pharma-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharma_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharma_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-dwh}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma_admin -d dwh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pharma-net

  tools:
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    image: pharma-tools:1.0.0
    container_name: pharma-tools
    volumes:
      - ./:/workspace
      - ./data/source:/workspace/data/source:ro
      - ./data/scratch:/workspace/data/scratch
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pharma_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pharma_secret_pw}
      - POSTGRES_DB=${POSTGRES_DB:-dwh}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharma-net

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: pharma-pushgateway
    restart: always
    ports:
      - "9091:9091"
    networks:
      - pharma-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pharma-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - pushgateway
    networks:
      - pharma-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pharma-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pharma-net

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: pharma-airflow:2.10.5
    container_name: pharma-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-pharma_admin}:${POSTGRES_PASSWORD:-pharma_secret_pw}@postgres:5432/${POSTGRES_DB:-dwh}
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharma-net

  airflow-webserver:
    image: pharma-airflow:2.10.5
    container_name: pharma-airflow-webserver
    restart: always
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-pharma_admin}:${POSTGRES_PASSWORD:-pharma_secret_pw}@postgres:5432/${POSTGRES_DB:-dwh}
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./scripts:/opt/airflow/scripts
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - pharma-net

  airflow-scheduler:
    image: pharma-airflow:2.10.5
    container_name: pharma-airflow-scheduler
    restart: always
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-pharma_admin}:${POSTGRES_PASSWORD:-pharma_secret_pw}@postgres:5432/${POSTGRES_DB:-dwh}
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqJZPo=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./scripts:/opt/airflow/scripts
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - pharma-net

volumes:
  pgdata:
  grafanadata:

networks:
  pharma-net:
    driver: bridge
